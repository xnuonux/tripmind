<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>crt · fluid · ascii</title>
<style>
  :root{ --ink:#9aa3b2; --accent:#39d0ff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; overflow:hidden; touch-action:none; overscroll-behavior:none;
    font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace; color:var(--ink); }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #hud{ position:fixed; left:18px; bottom:14px; z-index:5; font-size:11px; letter-spacing:.18em; color:#8b94a6;
    text-shadow:0 0 8px rgba(57,208,255,.25); pointer-events:none; }
  #hud b{ color:#cfe8ff; font-weight:500; } #hud .sep{ color:#3a4150; margin:0 7px; }
  #panel{ position:fixed; top:14px; right:14px; z-index:6; width:250px; max-height:92vh; overflow-y:auto;
    background:rgba(8,10,16,.72); border:1px solid rgba(120,140,170,.16); border-radius:12px;
    padding:14px 14px 12px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 18px 50px rgba(0,0,0,.5); user-select:none; }
  #panel::-webkit-scrollbar{ width:8px; } #panel::-webkit-scrollbar-thumb{ background:rgba(120,140,170,.25); border-radius:8px; }
  #panel.collapsed .body{ display:none; }
  #panel h1{ font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:#7f8aa0; font-weight:500;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  #panel h1 .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent); }
  .row{ margin-top:12px; } .row label{ display:flex; justify-content:space-between; font-size:11px; letter-spacing:.07em; color:#9aa6bc; margin-bottom:6px; }
  .row label .v{ color:#cfe8ff; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:3px; border-radius:3px; background:linear-gradient(90deg,#39d0ff55,#39d0ff22); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px;height:13px;border-radius:50%;background:#dff3ff;box-shadow:0 0 8px rgba(57,208,255,.7);cursor:pointer; }
  .seg{ display:flex; gap:6px; margin-top:7px; } .seg button,.btns button{ flex:1; font:inherit; font-size:10px; letter-spacing:.1em; text-transform:lowercase; color:#9fb0c8; background:rgba(120,140,170,.08); border:1px solid rgba(120,140,170,.16); border-radius:7px; padding:7px 3px; cursor:pointer; }
  .seg button.on{ color:#04121b; background:var(--accent); border-color:var(--accent); }
  .btns{ display:flex; gap:6px; margin-top:13px; }
  .recbtn{ width:100%; margin-top:8px; font:inherit; font-size:11px; letter-spacing:.16em; text-transform:lowercase;
    color:#ff9a9a; background:rgba(255,90,90,.10); border:1px solid rgba(255,90,90,.32); border-radius:8px; padding:10px; cursor:pointer; }
  .recbtn.on{ color:#fff; background:#e23b3b; border-color:#ff6a6a; box-shadow:0 0 18px rgba(226,59,59,.55); }
  #recdot{ position:fixed; top:14px; left:14px; z-index:8; display:none; align-items:center; gap:9px; font-size:12px;
    letter-spacing:.14em; color:#ff7a7a; background:rgba(8,10,16,.72); padding:8px 13px; border-radius:22px;
    border:1px solid rgba(255,90,90,.34); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  #recdot .rd{ width:9px;height:9px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 11px #ff3b3b; animation:rdpulse 1.1s infinite; }
  @keyframes rdpulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .hint{ margin-top:11px; font-size:10px; letter-spacing:.05em; color:#59647a; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="recdot"><span class="rd"></span><span id="rectime">00:00</span></div>
<div id="hud"></div>
<div id="panel">
  <h1 id="ptitle"><span>crt monitor</span><span class="dot"></span></h1>
  <div class="body">
    <div class="row"><label>flow <span class="v" id="vFlow">turbulent</span></label><input id="flow" type="range" min="0" max="100" value="55"></div>
    <div class="row"><label>dye persistence <span class="v" id="vDye">high</span></label><input id="dye" type="range" min="0" max="100" value="60"></div>
    <div class="row"><label>pixel size <span class="v" id="vPx">2 px</span></label><input id="px" type="range" min="2" max="8" value="2"></div>
    <div class="row"><label>char size <span class="v" id="vCh">6 px</span></label><input id="ch" type="range" min="5" max="12" value="6"></div>
    <div class="row"><label>curvature <span class="v" id="vCurve">0.13</span></label><input id="curve" type="range" min="0" max="60" value="13"></div>
    <div class="row"><label>scanlines <span class="v" id="vScan">0.09</span></label><input id="scan" type="range" min="0" max="100" value="9"></div>
    <div class="row"><label>phosphor pitch <span class="v" id="vPitch">3 px</span></label><input id="pitch" type="range" min="2" max="9" step="1" value="3"></div>
    <div class="row"><label>mask depth <span class="v" id="vMask">0.00</span></label><input id="mask" type="range" min="0" max="100" value="0"></div>
    <div class="row"><label>bloom <span class="v" id="vBloom">0.21</span></label><input id="bloom" type="range" min="0" max="120" value="21"></div>
    <div class="row"><label>colormap</label><div class="seg" id="cmap">
      <button data-c="0" class="on">turbo</button><button data-c="1">cool</button><button data-c="2">amber</button><button data-c="3">mono</button>
    </div></div>
    <div class="row"><label>terminal overlay</label><div class="seg" id="uitog">
      <button data-u="1" class="on">on</button><button data-u="0">off</button>
    </div></div>
    <div class="btns"><button id="pause">pause</button><button id="clear">clear</button><button id="save">save</button></div>
    <button id="rec" class="recbtn">● record</button>
    <div class="hint">drag to stir the fluid. it runs a real gpu fluid sim, rendered as ascii on a curved crt screen with rgb subpixels.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const P={ flow:0.55, dye:0.60, px:2, ch:6, curve:0.13, scan:0.09, bloom:0.21, pitch:3, mask:0.0, cmap:0, paused:false };
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas, antialias:false, alpha:false, preserveDrawingBuffer:true});
renderer.autoClear=false;
const gl=renderer.getContext();
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('OES_texture_float_linear');
const cam=new THREE.Camera();

/* fullscreen triangle */
const quad=new THREE.BufferGeometry();
quad.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]),3));

const baseVert=`
precision highp float;
attribute vec3 position; varying vec2 vUv, vL, vR, vT, vB; uniform vec2 texelSize;
void main(){ vUv=position.xy*0.5+0.5; vL=vUv-vec2(texelSize.x,0.); vR=vUv+vec2(texelSize.x,0.);
  vT=vUv+vec2(0.,texelSize.y); vB=vUv-vec2(0.,texelSize.y); gl_Position=vec4(position.xy,0.,1.); }`;

function prog(frag, uniforms){
  const mat=new THREE.RawShaderMaterial({vertexShader:baseVert, fragmentShader:frag, uniforms, depthTest:false, depthWrite:false});
  const m=new THREE.Mesh(quad,mat); m.frustumCulled=false;
  const scene=new THREE.Scene(); scene.add(m); return {mat,scene};
}
function blit(p,target){ renderer.setRenderTarget(target||null); renderer.render(p.scene,cam); }

/* ---- shaders ---- */
const F_advect=`precision highp float; varying vec2 vUv; uniform sampler2D uVelocity,uSource; uniform vec2 texelSize; uniform float dt,diss;
void main(){ vec2 c=vUv-dt*texture2D(uVelocity,vUv).xy*texelSize; gl_FragColor=texture2D(uSource,c)/(1.0+diss*dt); }`;
const F_splat=`precision highp float; varying vec2 vUv; uniform sampler2D uTarget; uniform float aspect,radius; uniform vec2 point; uniform vec3 color;
void main(){ vec2 p=vUv-point; p.x*=aspect; vec3 s=exp(-dot(p,p)/radius)*color; gl_FragColor=vec4(texture2D(uTarget,vUv).xyz+s,1.); }`;
const F_curl=`precision highp float; varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity;
void main(){ float L=texture2D(uVelocity,vL).y,R=texture2D(uVelocity,vR).y,T=texture2D(uVelocity,vT).x,B=texture2D(uVelocity,vB).x; gl_FragColor=vec4(0.5*(R-L-(T-B)),0.,0.,1.); }`;
const F_vort=`precision highp float; varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity,uCurl; uniform float curl,dt;
void main(){ float L=texture2D(uCurl,vL).x,R=texture2D(uCurl,vR).x,T=texture2D(uCurl,vT).x,B=texture2D(uCurl,vB).x,C=texture2D(uCurl,vUv).x;
  vec2 f=0.5*vec2(abs(T)-abs(B), abs(R)-abs(L)); f/=length(f)+1e-4; f*=curl*C; f.y*=-1.0;
  vec2 v=texture2D(uVelocity,vUv).xy; gl_FragColor=vec4(v+f*dt,0.,1.); }`;
const F_div=`precision highp float; varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity;
void main(){ float L=texture2D(uVelocity,vL).x,R=texture2D(uVelocity,vR).x,T=texture2D(uVelocity,vT).y,B=texture2D(uVelocity,vB).y; gl_FragColor=vec4(0.5*((R-L)+(T-B)),0.,0.,1.); }`;
const F_clear=`precision highp float; varying vec2 vUv; uniform sampler2D uTexture; uniform float value;
void main(){ gl_FragColor=value*texture2D(uTexture,vUv); }`;
const F_press=`precision highp float; varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uPressure,uDivergence;
void main(){ float L=texture2D(uPressure,vL).x,R=texture2D(uPressure,vR).x,T=texture2D(uPressure,vT).x,B=texture2D(uPressure,vB).x,d=texture2D(uDivergence,vUv).x;
  gl_FragColor=vec4((L+R+T+B-d)*0.25,0.,0.,1.); }`;
const F_grad=`precision highp float; varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uPressure,uVelocity;
void main(){ float L=texture2D(uPressure,vL).x,R=texture2D(uPressure,vR).x,T=texture2D(uPressure,vT).x,B=texture2D(uPressure,vB).x;
  vec2 v=texture2D(uVelocity,vUv).xy; v-=0.5*vec2(R-L,T-B); gl_FragColor=vec4(v,0.,1.); }`;

/* content pass: fluid -> ascii glyphs (jet color) */
const F_content=`precision highp float; varying vec2 vUv;
uniform sampler2D uDye, uAtlas, uUI; uniform vec2 uRes; uniform float uPx,uCh,uN,uBoost; uniform int uCmap;
vec3 turbo(float t){ t=clamp(t,0.,1.); vec3 c;
  if(t<0.25) c=mix(vec3(0.18,0.07,0.24),vec3(0.0,0.56,0.86),t/0.25);
  else if(t<0.5) c=mix(vec3(0.0,0.56,0.86),vec3(0.18,0.92,0.32),(t-0.25)/0.25);
  else if(t<0.75) c=mix(vec3(0.18,0.92,0.32),vec3(0.98,0.88,0.0),(t-0.5)/0.25);
  else c=mix(vec3(0.98,0.88,0.0),vec3(0.94,0.12,0.05),(t-0.75)/0.25);
  return c; }
vec3 cool(float t){ t=clamp(t,0.,1.);
  vec3 c=mix(vec3(0.0,0.02,0.16),vec3(0.0,0.40,1.0),smoothstep(0.,0.45,t));
  c=mix(c,vec3(0.30,0.95,1.0),smoothstep(0.4,0.78,t));
  return mix(c,vec3(0.92,1.0,1.0),smoothstep(0.8,1.0,t)); }
vec3 amber(float t){ t=clamp(t,0.,1.); return mix(vec3(0.16,0.05,0.0), mix(vec3(1.0,0.55,0.05),vec3(1.0,0.96,0.74),smoothstep(0.6,1.0,t)), smoothstep(0.0,0.6,t)); }
vec3 cmap(float t){ if(uCmap==0)return turbo(t); if(uCmap==1)return cool(t); if(uCmap==2)return amber(t); return vec3(pow(t,0.85)); }
void main(){
  vec2 px=vUv*uRes;
  vec2 lp=floor(px/uPx);
  vec2 cell=floor(lp/uCh);
  vec2 inC=lp-cell*uCh;
  vec2 cellUv=(cell+0.5)*(uCh*uPx)/uRes;
  float d=texture2D(uDye,cellUv).x;
  float t=clamp(1.0-exp(-d*1.15),0.,1.);
  float gi=floor(t*(uN-1.0));
  vec2 auv=vec2((gi+(inC.x+0.5)/uCh)/uN, (inC.y+0.5)/uCh);
  float g=texture2D(uAtlas,auv).r;
  vec3 col=cmap(t)*g*(0.45+0.55*t)*uBoost;
  vec4 ui=texture2D(uUI, vec2(vUv.x, 1.0-vUv.y));
  col=mix(col, ui.rgb, ui.a);
  gl_FragColor=vec4(col,1.0);
}`;

/* bloom: bright-pass blur (separable, cheap single pass approx) */
const F_blur=`precision highp float; varying vec2 vUv; uniform sampler2D uTex; uniform vec2 dir;
void main(){ vec3 s=vec3(0.); 
  s+=texture2D(uTex,vUv).rgb*0.227;
  s+=texture2D(uTex,vUv+dir*1.0).rgb*0.196; s+=texture2D(uTex,vUv-dir*1.0).rgb*0.196;
  s+=texture2D(uTex,vUv+dir*2.4).rgb*0.124; s+=texture2D(uTex,vUv-dir*2.4).rgb*0.124;
  s+=texture2D(uTex,vUv+dir*4.0).rgb*0.066; s+=texture2D(uTex,vUv-dir*4.0).rgb*0.066;
  gl_FragColor=vec4(s,1.0); }`;

/* crt pass to screen: curvature + rgb subpixels + scanlines + vignette + bloom */
const F_crt=`precision highp float; varying vec2 vUv;
uniform sampler2D uContent, uBloom; uniform vec2 uRes;
uniform float uCurve,uScan,uBloomAmt,uPitch,uScanPitch,uMask,uBoost;
vec2 curveUV(vec2 uv){ uv=uv*2.0-1.0; float r2=dot(uv,uv); uv*=1.0+uCurve*r2; return uv*0.5+0.5; }
// soft aperture-grille phosphor: three RGB lobes per triad, wrapped so stripes are continuous
vec3 grille(float x){
  float t=fract(x/uPitch);
  float w=0.205;
  float r=exp(-pow((t-0.16667)/w,2.0))+exp(-pow((t-1.16667)/w,2.0));
  float g=exp(-pow((t-0.50000)/w,2.0));
  float b=exp(-pow((t-0.83333)/w,2.0))+exp(-pow((t+0.16667)/w,2.0));
  return vec3(r,g,b);
}
void main(){
  vec2 suv=curveUV(vUv);
  if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0){ gl_FragColor=vec4(0.,0.,0.,1.); return; }
  vec3 col=texture2D(uContent,suv).rgb;
  vec3 bl=texture2D(uBloom,suv).rgb;
  vec2 fc=suv*uRes;
  // phosphor mask (aperture grille)
  vec3 m=grille(fc.x);
  m=mix(vec3(1.0), m, uMask);
  // scanline beam profile
  float sy=fract(fc.y/uScanPitch);
  float beam=exp(-pow((sy-0.5)/0.34,2.0));
  beam=mix(1.0, beam, uScan);
  col = col*m*beam*uBoost;
  // halation glow rides on top (not masked) so brights bloom through the grille
  col += bl*uBloomAmt;
  // vignette
  vec2 c=vUv*2.0-1.0; float r2=dot(c,c);
  col*=mix(0.42,1.10, smoothstep(2.4,0.30,r2));
  // faint glass sheen near top
  col += vec3(0.04,0.05,0.07)*smoothstep(0.65,0.0,suv.y)*0.5*smoothstep(1.2,0.2,r2);
  gl_FragColor=vec4(col,1.0);
}`;

/* ---- targets ---- */
let SIM=256, dpr=Math.min(window.devicePixelRatio||1,3);
let velA,velB,dyeA,dyeB,prsA,prsB,divRT,curlRT, contentRT, bloomRTa, bloomRTb;
function mkRT(w,h,linear){ return new THREE.WebGLRenderTarget(w,h,{type:THREE.HalfFloatType,format:THREE.RGBAFormat,
  minFilter:linear?THREE.LinearFilter:THREE.NearestFilter, magFilter:linear?THREE.LinearFilter:THREE.NearestFilter, depthBuffer:false, stencilBuffer:false}); }
function dbl(w,h,linear){ return {a:mkRT(w,h,linear), b:mkRT(w,h,linear), get read(){return this.a;}, get write(){return this.b;}, swap(){const t=this.a;this.a=this.b;this.b=t;}}; }

let simW,simH, CW,CH; // sim dims, canvas px dims
function allocSim(){
  const ar=window.innerWidth/window.innerHeight;
  if(ar>=1){ simW=SIM; simH=Math.round(SIM/ar); } else { simH=SIM; simW=Math.round(SIM*ar); }
  velA=dbl(simW,simH,true); dyeA=dbl(simW,simH,true); prsA=dbl(simW,simH,false);
  vel=velA; dye=dyeA; prs=prsA;
  divRT=mkRT(simW,simH,false); curlRT=mkRT(simW,simH,false);
}
let vel,dye,prs;
function allocScreen(){
  CW=Math.round(window.innerWidth*dpr); CH=Math.round(window.innerHeight*dpr);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setPixelRatio(dpr);
  if(contentRT) contentRT.dispose();
  contentRT=mkRT(CW,CH,true);
  const bw=Math.max(2,Math.round(CW*0.35)), bh=Math.max(2,Math.round(CH*0.35));
  if(bloomRTa) bloomRTa.dispose(); if(bloomRTb) bloomRTb.dispose();
  bloomRTa=mkRT(bw,bh,true); bloomRTb=mkRT(bw,bh,true);
}

/* ---- font atlas ---- */
const RAMP=" .'\":;~-=+!licsv*xoTYUJC0OQ8B#$@";
let atlasTex, atlasN=RAMP.length;
function makeAtlas(){
  const cw=16, chh=16;
  const cv=document.createElement('canvas'); cv.width=cw*atlasN; cv.height=chh;
  const x=cv.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,cv.width,cv.height);
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; x.font='700 13px "DM Mono", ui-monospace, monospace';
  for(let i=0;i<atlasN;i++) x.fillText(RAMP[i], i*cw+cw/2, chh/2+1);
  atlasTex=new THREE.CanvasTexture(cv); atlasTex.minFilter=THREE.NearestFilter; atlasTex.magFilter=THREE.NearestFilter; atlasTex.generateMipmaps=false;
}
makeAtlas();

/* ---- terminal ui overlay (drawn to a canvas, composited through the crt) ---- */
const uiCv=document.createElement('canvas'); uiCv.width=512; uiCv.height=288;
const uix=uiCv.getContext('2d');
const uiTex=new THREE.CanvasTexture(uiCv); uiTex.flipY=false; uiTex.minFilter=THREE.NearestFilter; uiTex.magFilter=THREE.NearestFilter; uiTex.generateMipmaps=false;
let blink=true, uiTab=0, uiOn=true;
function drawUI(){
  const w=uiCv.width,h=uiCv.height; uix.clearRect(0,0,w,h);
  if(!uiOn){ uiTex.needsUpdate=true; return; }
  const x0=Math.round(w*0.13), y0=Math.round(h*0.31), x1=Math.round(w*0.87), y1=Math.round(h*0.79);
  uix.fillStyle='rgba(2,3,8,0.80)'; uix.fillRect(x0,y0,x1-x0,y1-y0);
  uix.strokeStyle='#c9a84c'; uix.lineWidth=2; uix.strokeRect(x0+1,y0+1,x1-x0-2,y1-y0-2);
  const tabW=Math.round((x1-x0)/2);
  uix.fillStyle=uiTab===0?'#c9a84c':'rgba(201,168,76,0.16)'; uix.fillRect(x0,y0,tabW,15);
  uix.fillStyle=uiTab===1?'#c9a84c':'rgba(201,168,76,0.16)'; uix.fillRect(x0+tabW,y0,x1-x0-tabW,15);
  uix.font='700 9px "DM Mono",ui-monospace,monospace'; uix.textBaseline='middle';
  uix.fillStyle=uiTab===0?'#06080e':'#c9a84c'; uix.fillText('CREW', x0+9, y0+8);
  uix.fillStyle=uiTab===1?'#06080e':'#c9a84c'; uix.fillText('CONTACT', x0+tabW+9, y0+8);
  uix.font='700 12px "DM Mono",ui-monospace,monospace';
  if(uiTab===0){
    uix.fillStyle='#eef2fa'; uix.fillText('the ai crew that ships.', x0+15, y0+42);
    uix.fillStyle='#c9a84c'; uix.fillText('not just chats.', x0+15, y0+63);
    uix.fillStyle='#9aa3b2'; uix.font='700 9px "DM Mono",ui-monospace,monospace';
    uix.fillText('raven · nova · atlas · gen · echo', x0+15, y0+88);
  } else {
    uix.fillStyle='#eef2fa'; uix.fillText('dom@lunari.pro', x0+15, y0+46);
    uix.fillStyle='#c9a84c'; uix.fillText('x: @LunariPro', x0+15, y0+69);
  }
  uix.fillStyle='#dce3f0'; uix.font='700 12px "DM Mono",ui-monospace,monospace'; uix.fillText('>', x0+15, y1-17);
  if(blink){ uix.fillRect(x0+30, y1-24, 9, 14); }
  uiTex.needsUpdate=true;
}
drawUI();
setInterval(()=>{ blink=!blink; drawUI(); }, 530);
setInterval(()=>{ if(uiOn){ uiTab=1-uiTab; drawUI(); } }, 7000);

/* ---- programs ---- */
const U2=()=>({value:new THREE.Vector2()});
const pAdv=prog(F_advect,{texelSize:U2(),uVelocity:{value:null},uSource:{value:null},dt:{value:0},diss:{value:0}});
const pSplat=prog(F_splat,{texelSize:U2(),uTarget:{value:null},aspect:{value:1},radius:{value:0.0002},point:{value:new THREE.Vector2()},color:{value:new THREE.Vector3()}});
const pCurl=prog(F_curl,{texelSize:U2(),uVelocity:{value:null}});
const pVort=prog(F_vort,{texelSize:U2(),uVelocity:{value:null},uCurl:{value:null},curl:{value:0},dt:{value:0}});
const pDiv=prog(F_div,{texelSize:U2(),uVelocity:{value:null}});
const pClear=prog(F_clear,{texelSize:U2(),uTexture:{value:null},value:{value:0.8}});
const pPress=prog(F_press,{texelSize:U2(),uPressure:{value:null},uDivergence:{value:null}});
const pGrad=prog(F_grad,{texelSize:U2(),uPressure:{value:null},uVelocity:{value:null}});
const pContent=prog(F_content,{texelSize:U2(),uDye:{value:null},uAtlas:{value:atlasTex},uUI:{value:uiTex},uRes:{value:new THREE.Vector2()},uPx:{value:3},uCh:{value:8},uN:{value:atlasN},uBoost:{value:1.7},uCmap:{value:0}});
const pBlur=prog(F_blur,{texelSize:U2(),uTex:{value:null},dir:{value:new THREE.Vector2()}});
const pCrt=prog(F_crt,{texelSize:U2(),uContent:{value:null},uBloom:{value:null},uRes:{value:new THREE.Vector2()},uCurve:{value:0.18},uScan:{value:0.35},uBloomAmt:{value:0.7},uPitch:{value:3},uScanPitch:{value:3},uMask:{value:0.7},uBoost:{value:1.8}});

function setTexel(p,w,h){ p.mat.uniforms.texelSize.value.set(1/w,1/h); }

allocSim(); allocScreen();

/* ---- splat helpers ---- */
function splatVel(x,y,fx,fy,rad){
  setTexel(pSplat,simW,simH); pSplat.mat.uniforms.uTarget.value=vel.read.texture;
  pSplat.mat.uniforms.aspect.value=simW/simH; pSplat.mat.uniforms.point.value.set(x,y);
  pSplat.mat.uniforms.radius.value=rad; pSplat.mat.uniforms.color.value.set(fx,fy,0);
  blit(pSplat,vel.write); vel.swap();
}
function splatDye(x,y,amt,rad){
  setTexel(pSplat,simW,simH); pSplat.mat.uniforms.uTarget.value=dye.read.texture;
  pSplat.mat.uniforms.aspect.value=simW/simH; pSplat.mat.uniforms.point.value.set(x,y);
  pSplat.mat.uniforms.radius.value=rad; pSplat.mat.uniforms.color.value.set(amt,0,0);
  blit(pSplat,dye.write); dye.swap();
}
function splat(x,y,fx,fy,amt,rad){ splatVel(x,y,fx,fy,rad); splatDye(x,y,amt,rad); }

/* ---- auto forcing ---- */
let T=0; const O=[]; for(let k=0;k<6;k++)O.push(Math.random()*6.28);
let emitters=[]; function initEm(){ emitters=[]; const n=6; for(let k=0;k<n;k++) emitters.push(spawnEm()); }
function spawnEm(){ return {x:Math.random(),y:Math.random(),vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,life:3+Math.random()*5,age:0,amt:0.5+Math.random()*0.5}; }
initEm();
function autoForce(dt){
  T+=dt;
  for(let k=0;k<emitters.length;k++){ const e=emitters[k];
    e.vx+=(Math.random()-0.5)*8.0*dt; e.vy+=(Math.random()-0.5)*8.0*dt; e.vx*=0.97; e.vy*=0.97;
    e.x+=e.vx*dt*1.6; e.y+=e.vy*dt*1.6;
    if(e.x<0.05||e.x>0.95)e.vx*=-1; if(e.y<0.05||e.y>0.95)e.vy*=-1;
    e.x=Math.min(0.97,Math.max(0.03,e.x)); e.y=Math.min(0.97,Math.max(0.03,e.y)); e.age+=dt;
    splat(e.x,e.y, e.vx*P.flow*1600, e.vy*P.flow*1600, e.amt, 0.0026);
    if(e.age>e.life) emitters[k]=spawnEm();
  }
  const rate=1.2+P.flow*2.6;
  if(Math.random()<rate*dt){ const a=Math.random()*6.28, sp=(800+Math.random()*1600)*P.flow;
    splat(Math.random(),Math.random(), Math.cos(a)*sp, Math.sin(a)*sp, 0.6+Math.random()*0.7, 0.0028); }
}

/* ---- pointer ---- */
let down=false,lx=0,ly=0;
function ptr(e){ const t=e.touches&&e.touches[0]?e.touches[0]:e; const r=canvas.getBoundingClientRect();
  return [(t.clientX-r.left)/r.width, 1.0-(t.clientY-r.top)/r.height]; }
function pdown(e){ down=true; [lx,ly]=ptr(e); }
function pmove(e){ if(!down)return; if(e.cancelable)e.preventDefault(); const [x,y]=ptr(e);
  const dx=(x-lx), dy=(y-ly); splat(x,y, dx*6000.0, dy*6000.0, 1.0, 0.003); lx=x; ly=y; }
function pup(){ down=false; }
canvas.addEventListener('mousedown',pdown); window.addEventListener('mousemove',pmove); window.addEventListener('mouseup',pup);
canvas.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();pdown(e);},{passive:false});
canvas.addEventListener('touchmove',pmove,{passive:false}); window.addEventListener('touchend',pup);

/* ---- step ---- */
function simulate(dt){
  autoForce(dt);
  setTexel(pCurl,simW,simH); pCurl.mat.uniforms.uVelocity.value=vel.read.texture; blit(pCurl,curlRT);
  setTexel(pVort,simW,simH); pVort.mat.uniforms.uVelocity.value=vel.read.texture; pVort.mat.uniforms.uCurl.value=curlRT.texture;
    pVort.mat.uniforms.curl.value=8.0+P.flow*38.0; pVort.mat.uniforms.dt.value=dt; blit(pVort,vel.write); vel.swap();
  setTexel(pDiv,simW,simH); pDiv.mat.uniforms.uVelocity.value=vel.read.texture; blit(pDiv,divRT);
  setTexel(pClear,simW,simH); pClear.mat.uniforms.uTexture.value=prs.read.texture; pClear.mat.uniforms.value.value=0.8; blit(pClear,prs.write); prs.swap();
  setTexel(pPress,simW,simH); pPress.mat.uniforms.uDivergence.value=divRT.texture;
  for(let i=0;i<20;i++){ pPress.mat.uniforms.uPressure.value=prs.read.texture; blit(pPress,prs.write); prs.swap(); }
  setTexel(pGrad,simW,simH); pGrad.mat.uniforms.uPressure.value=prs.read.texture; pGrad.mat.uniforms.uVelocity.value=vel.read.texture; blit(pGrad,vel.write); vel.swap();
  setTexel(pAdv,simW,simH);
  pAdv.mat.uniforms.dt.value=dt; pAdv.mat.uniforms.uVelocity.value=vel.read.texture; pAdv.mat.uniforms.uSource.value=vel.read.texture; pAdv.mat.uniforms.diss.value=0.2; blit(pAdv,vel.write); vel.swap();
  pAdv.mat.uniforms.uVelocity.value=vel.read.texture; pAdv.mat.uniforms.uSource.value=dye.read.texture; pAdv.mat.uniforms.diss.value=(1.0-P.dye)*2.0+0.1; blit(pAdv,dye.write); dye.swap();
}

let last=performance.now(), fps=60, fN=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now; if(dt>0.033)dt=0.033;
  if(!P.paused){ simulate(dt); }
  // content
  setTexel(pContent,CW,CH); pContent.mat.uniforms.uDye.value=dye.read.texture; pContent.mat.uniforms.uRes.value.set(CW,CH);
  pContent.mat.uniforms.uPx.value=P.px*dpr; pContent.mat.uniforms.uCh.value=P.ch; pContent.mat.uniforms.uCmap.value=P.cmap;
  blit(pContent, contentRT);
  // bloom (two-pass blur of content)
  const bw=bloomRTa.width, bh=bloomRTa.height;
  setTexel(pBlur,bw,bh); pBlur.mat.uniforms.uTex.value=contentRT.texture; pBlur.mat.uniforms.dir.value.set(1.2/bw,0); blit(pBlur,bloomRTb);
  pBlur.mat.uniforms.uTex.value=bloomRTb.texture; pBlur.mat.uniforms.dir.value.set(0,1.2/bh); blit(pBlur,bloomRTa);
  // crt to screen
  setTexel(pCrt,CW,CH); pCrt.mat.uniforms.uContent.value=contentRT.texture; pCrt.mat.uniforms.uBloom.value=bloomRTa.texture;
  pCrt.mat.uniforms.uRes.value.set(CW,CH); pCrt.mat.uniforms.uCurve.value=P.curve;
  pCrt.mat.uniforms.uScan.value=P.scan; pCrt.mat.uniforms.uBloomAmt.value=P.bloom;
  pCrt.mat.uniforms.uPitch.value=P.pitch*dpr; pCrt.mat.uniforms.uScanPitch.value=P.pitch*dpr;
  pCrt.mat.uniforms.uMask.value=P.mask; pCrt.mat.uniforms.uBoost.value=1.0+P.mask*1.45+P.scan*0.6;
  blit(pCrt,null);
  fN++; if(now-fpsLast>500){ fps=Math.round(fN*1000/(now-fpsLast)); fN=0; fpsLast=now; updateHUD(); }
}
let fpsLast=performance.now();

/* seed */
function seed(){ for(let k=0;k<26;k++) splat(0.1+0.8*Math.random(), 0.1+0.8*Math.random(), (Math.random()-0.5)*3000, (Math.random()-0.5)*3000, 0.7, 0.003); }
seed();
requestAnimationFrame(frame);

/* ---- UI ---- */
const el=id=>document.getElementById(id);
function updateHUD(){ el('hud').innerHTML=`<b>gpu fluid</b> <span class="sep">·</span> ${simW}×${simH} sim <span class="sep">·</span> <b>${fps}</b> fps`; }
const bind=(id,fn)=>el(id).addEventListener('input',e=>fn(+e.target.value));
bind('flow',v=>{P.flow=v/100; el('vFlow').textContent=P.flow<0.12?'still':P.flow<0.4?'calm':P.flow<0.72?'turbulent':'chaotic';});
bind('dye',v=>{P.dye=v/100; el('vDye').textContent=P.dye<0.4?'low':P.dye<0.75?'high':'persistent';});
bind('px',v=>{P.px=v; el('vPx').textContent=v+' px';});
bind('ch',v=>{P.ch=v; el('vCh').textContent=v+' px';});
bind('curve',v=>{P.curve=v/100; el('vCurve').textContent=P.curve.toFixed(2);});
bind('scan',v=>{P.scan=v/100; el('vScan').textContent=P.scan.toFixed(2);});
bind('pitch',v=>{P.pitch=v; el('vPitch').textContent=v+' px';});
bind('mask',v=>{P.mask=v/100; el('vMask').textContent=P.mask.toFixed(2);});
bind('bloom',v=>{P.bloom=v/100; el('vBloom').textContent=P.bloom.toFixed(2);});
document.querySelectorAll('#cmap button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#cmap button').forEach(x=>x.classList.remove('on'));b.classList.add('on');P.cmap=+b.dataset.c;});
document.querySelectorAll('#uitog button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#uitog button').forEach(x=>x.classList.remove('on'));b.classList.add('on');uiOn=(b.dataset.u==='1');drawUI();});
el('pause').onclick=()=>{P.paused=!P.paused; el('pause').textContent=P.paused?'play':'pause';};
el('clear').onclick=()=>{ // zero dye+vel by splatting nothing: re-alloc
  const old=dye; dye=dbl(simW,simH,true); old.a.dispose(); old.b.dispose();
  const ov=vel; vel=dbl(simW,simH,true); ov.a.dispose(); ov.b.dispose(); seed(); };
el('save').onclick=()=>{ try{ const a=document.createElement('a'); a.download='crt-'+Date.now()+'.png'; a.href=canvas.toDataURL('image/png'); a.click(); }catch(e){} };

/* ---- record to video (captures the screen on this gpu, no panel) ---- */
let mediaRec=null, recChunks=[], recT0=0, recTimer=null, recMime='';
function pickMime(){
  const cands=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1.42E01E','video/mp4;codecs=h264','video/mp4',
    'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  if(!window.MediaRecorder) return '';
  for(const m of cands){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
function startRec(){
  recMime=pickMime();
  if(!recMime){ el('rec').textContent='not supported'; setTimeout(()=>el('rec').textContent='● record',1600); return; }
  const ext=recMime.indexOf('mp4')>=0?'mp4':'webm';
  let stream; try{ stream=canvas.captureStream(60); }catch(e){ el('rec').textContent='capture failed'; setTimeout(()=>el('rec').textContent='● record',1600); return; }
  try{ mediaRec=new MediaRecorder(stream,{mimeType:recMime, videoBitsPerSecond:28000000}); }
  catch(e){ try{ mediaRec=new MediaRecorder(stream,{mimeType:recMime}); }catch(e2){ mediaRec=new MediaRecorder(stream); } }
  recChunks=[];
  mediaRec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  mediaRec.onstop=()=>{ const blob=new Blob(recChunks,{type:recMime||'video/webm'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='lunari-crt-'+Date.now()+'.'+ext; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); };
  mediaRec.start(200);
  recT0=performance.now(); el('rec').classList.add('on'); el('rec').textContent='■ stop  ('+ext+')'; el('recdot').style.display='flex';
  recTimer=setInterval(()=>{ const s=Math.floor((performance.now()-recT0)/1000);
    el('rectime').textContent=String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); },250);
}
function stopRec(){ try{ if(mediaRec&&mediaRec.state!=='inactive') mediaRec.stop(); }catch(e){}
  clearInterval(recTimer); el('rec').classList.remove('on'); el('rec').textContent='● record'; el('recdot').style.display='none'; mediaRec=null; }
el('rec').onclick=()=>{ if(mediaRec) stopRec(); else startRec(); };
el('ptitle').onclick=()=>el('panel').classList.toggle('collapsed');

window.addEventListener('resize',()=>{ dpr=Math.min(window.devicePixelRatio||1,3); allocScreen(); allocSim(); seed(); });
updateHUD();
</script>
</body>
</html>
